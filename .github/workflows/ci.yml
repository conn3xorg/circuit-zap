name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Podman in the host container needs a rootful, privileged container.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # Starts a weak page in the host's own Podman, the only thing ever
      # scanned here, then checks the report names a finding the page has and
      # that its access log shows no attack payloads.
      - name: Scan the weak page, passively
        working-directory: examples/local
        run: sudo podman exec -i circuit-zap sh -s http://10.89.0.250:8099/ passive < check.sh
      - name: Scan the weak page with active_scan, and see the attacks arrive
        working-directory: examples/local
        run: |
          conn3x apply -auto-approve -var active_scan=true
          sudo podman exec -i circuit-zap sh -s http://10.89.0.250:8099/ active < check.sh
      - name: Check the results stay root's and the scan's own directory is gone
        run: |
          sudo podman exec circuit-zap sh -ec '
            cd /var/lib/conn3x-zap
            [ "$(stat -L -c "%U" latest)" = root ]
            [ "$(stat -c "%U" latest/summary.txt)" = root ]
            [ -z "$(find . -maxdepth 1 -name ".scan-*")" ]
          '
      # Restarting the container boots systemd again, so this checks the
      # timer comes back by itself and a scan still runs after it.
      - name: Restart the host, then scan again and check the plan
        working-directory: examples/local
        run: |
          sudo podman restart circuit-zap
          for _ in $(seq 60); do
            case $(sudo podman exec circuit-zap systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          sudo podman exec circuit-zap systemctl is-active conn3x-zap.timer
          sudo podman exec -i circuit-zap sh -s http://10.89.0.250:8099/ active < check.sh
          conn3x plan -detailed-exitcode -var active_scan=true
      # A fresh host gets the previous release, then the circuit's own pin
      # is applied over it, the way someone raises zap_version and
      # image_digest. The scan script has to move to the new image.
      - name: Upgrade from ZAP 2.16.1 on a fresh host, then plan again with no changes
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          PODMAN: sudo podman
        run: |
          ./down.sh
          ./up.sh
          sed -i 's|^  source = "../.."$|&\n  zap_version  = "2.16.1"\n  image_digest = "sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab"|' main.tf
          grep -q 'zap_version  = "2.16.1"' main.tf
          conn3x init
          conn3x apply -auto-approve
          sudo podman exec circuit-zap grep -q 'zaproxy:2\.16\.1@' /usr/local/sbin/conn3x-zap
          git checkout -- main.tf
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-zap grep -q 'zaproxy:2\.17\.0@' /usr/local/sbin/conn3x-zap
          if sudo podman exec circuit-zap grep -q 'zaproxy:2\.16\.1' /usr/local/sbin/conn3x-zap; then exit 1; fi
      - name: Scan the weak page with the upgraded ZAP
        working-directory: examples/local
        run: sudo podman exec -i circuit-zap sh -s http://10.89.0.250:8099/ passive < check.sh
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
